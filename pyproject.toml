[project]
name = "pymodoro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyinstaller==6.16.0",
    "pymongo==4.11.1",
    "pyqt6==6.7.1",
    "python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 120
exclude = [
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = 120
docstring-code-format = true
line-ending = "lf"